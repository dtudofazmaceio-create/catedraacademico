<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a33">
<title>Cátedra · Turmas, avaliações e correção inteligente</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ef;--surface:#fff;--ink:#16213a;--muted:#687083;--line:#e7e4dc;--primary:#2948d1;--primary-2:#1d36a8;--primary-soft:#e9edfd;--accent:#e8a33d;--ok:#1b8f62;--ok-soft:#e2f4ec;--warn:#b7741a;--warn-soft:#fbf0dc;--bad:#c93b3b;--bad-soft:#fbe6e6;--side:#111a33;--radius:16px;--shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0;font-weight:700}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.muted{color:var(--muted)}
.small{font-size:13px}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
/* Sidebar */
.side{background:var(--side);color:#cdd5ea;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;background-image:radial-gradient(600px 300px at -100px -50px,rgba(41,72,209,.35),transparent)}
.brand{display:flex;gap:12px;align-items:center;padding:4px 10px 28px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#e8a33d,#f6cf86);color:#111a33;display:grid;place-items:center;font:700 22px Fraunces,serif;flex:none}
.brand b{color:#fff;font:700 20px Fraunces,serif;display:block;line-height:1.1}
.brand small{color:#8a96b8;font-size:12px}
.side nav a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;color:#b8c2de;font-weight:500;margin-bottom:3px;transition:.15s}
.side nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side nav a.active{background:rgba(255,255,255,.1);color:#fff}
.side nav a.active svg{color:var(--accent)}
.side-foot{margin-top:auto;background:rgba(255,255,255,.05);border-radius:12px;padding:12px;font-size:13px}
.side-foot button{margin-top:8px;width:100%;background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:8px;padding:8px;cursor:pointer;font-weight:600;display:flex;gap:8px;justify-content:center;align-items:center}
.side-foot button:hover{background:rgba(255,255,255,.14)}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#7c859c;flex:none}
.dot.ok{background:#35c88a;box-shadow:0 0 0 3px rgba(53,200,138,.2)}
.dot.busy{background:var(--accent);animation:pulse 1s infinite}
.dot.err{background:#ef5a5a}
@keyframes pulse{50%{opacity:.35}}
.content{min-width:0}
.top{display:none}
main{padding:34px clamp(16px,4vw,48px) 70px;max-width:1260px}
.bottom{display:none}
/* Page */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h2{font-size:30px}
.page-head p{margin:4px 0 0}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:8px}
.crumb:hover{color:var(--primary)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.cards{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:22px}
.two{grid-template-columns:1.4fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:18px;margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-head h3{margin:0}
.stat{display:flex;gap:14px;align-items:center}
.stat .si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:none}
.stat b{font:700 26px Fraunces,serif;display:block;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.turma-card{position:relative;overflow:hidden;transition:.2s;display:block}
.turma-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.turma-card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(16,24,40,.09)}
.turma-card h3{margin:10px 0 2px;font-size:20px}
.tc-stats{display:flex;gap:16px;margin:14px 0 12px;color:var(--muted);font-size:13px}
.tc-stats span{display:flex;align-items:center;gap:6px}
.bar{height:7px;border-radius:9px;background:#eeebe4;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--c,var(--primary));border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:#f1efe9;font-size:12px;font-weight:600;color:#4a5265}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);transition:.15s;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:#cfcabd;background:#fbfaf7}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#1b1405}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);border-color:#f0c4c4}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(0,0,0,.04)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.big{padding:14px 20px;font-size:15px;border-radius:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:rgba(0,0,0,.05);color:var(--ink)}
/* Forms */
.field{margin-bottom:14px}
.field>label,.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#353d52}
.field .hint,.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
input[type=text],input[type=number],input[type=password],input[type=email],input[type=url],input[type=datetime-local],input:not([type]),select,textarea{width:100%;border:1px solid #dcd8ce;border-radius:11px;padding:10px 12px;font:inherit;font-size:14.5px;background:#fff;color:var(--ink);transition:.15s}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(41,72,209,.12)}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:10px;cursor:pointer}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--primary)}
.seg{display:inline-flex;background:#ece9e1;padding:4px;border-radius:12px;gap:4px}
.seg label{padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;color:#4b5266;display:flex;gap:8px;align-items:center}
.seg input{display:none}
.seg label:has(input:checked){background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
fieldset{border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
legend{font:700 15px Fraunces,serif;padding:0 8px}
.dyn-row{display:grid;gap:8px;grid-template-columns:2fr 80px 3fr 36px;align-items:start;margin-bottom:8px}
.gab-row{display:grid;gap:8px;grid-template-columns:62px 120px 1fr 80px 36px;align-items:start;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.gab-row .conc{grid-column:3/5}
.dyn-head{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
/* Tables */
.table-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid #efece5;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#faf9f5}
.tbl .num{text-align:center}
.matrix td,.matrix th{text-align:center;white-space:nowrap}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.gray{background:#efede7;color:#5b6274}
.badge.dark{background:var(--side);color:#fff}
.nota{display:inline-block;min-width:46px;text-align:center;padding:4px 8px;border-radius:8px;font-weight:700;font-variant-numeric:tabular-nums}
.nota.ok{background:var(--ok-soft);color:var(--ok)}
.nota.warn{background:var(--warn-soft);color:var(--warn)}
.nota.bad{background:var(--bad-soft);color:var(--bad)}
.nota.none{color:#a3a8b5}
/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs a{padding:11px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs a.active{color:var(--primary);border-color:var(--primary)}
/* Lists */
.list-item{display:flex;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid #efece5}
.list-item:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff}
.li-main{flex:1;min-width:0}
.li-main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-main span{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:50px 20px}
.empty .ei{width:64px;height:64px;border-radius:18px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 16px}
.empty h3{font-size:20px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:420px}
/* Link box */
.linkbox{display:flex;gap:8px;align-items:center;background:#f7f6f2;border:1px dashed #d6d1c4;border-radius:12px;padding:8px 8px 8px 14px}
.linkbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#3d4560}
.alert{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.alert svg{flex:none;margin-top:2px}
.alert.warn{background:var(--warn-soft);color:#7a4c0e}
.alert.info{background:var(--primary-soft);color:#1f3596}
.alert.bad{background:var(--bad-soft);color:#8f2424}
.alert.ok{background:var(--ok-soft);color:#11603f}
/* Report */
.report-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{--p:0;--rc:var(--primary);width:128px;height:128px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),#ece9e2 0);display:grid;place-items:center;flex:none}
.ring>div{width:104px;height:104px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font:700 32px Fraunces,serif;line-height:1}
.ring span{font-size:12px;color:var(--muted)}
.crit{margin-bottom:14px}
.crit-top{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px;margin-bottom:5px}
.crit p{margin:5px 0 0;font-size:13.5px;color:#4a5265}
.conf{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0ede6;font-size:14px}
.conf:last-child{border:0}
.conf .ci{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.conf .ci.ok{background:var(--ok-soft);color:var(--ok)}
.conf .ci.bad{background:var(--bad-soft);color:var(--bad)}
.blist{margin:0;padding-left:18px}
.blist li{margin-bottom:6px;font-size:14px}
.parecer{background:#faf8f3;border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;font-size:14.5px}
details.raw summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
details.raw pre{white-space:pre-wrap;font-size:13px;background:#f7f6f2;padding:14px;border-radius:10px;max-height:340px;overflow:auto}
/* Upload */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed #cfd6f5;background:#f7f9ff;border-radius:16px;padding:32px 16px;cursor:pointer;color:var(--primary);transition:.15s}
.drop.over,.drop:hover{background:#eef2ff;border-color:var(--primary)}
.drop b{color:var(--ink)}
.drop span{font-size:13px;color:var(--muted)}
.upl-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upl-list{display:grid;gap:8px;margin-top:12px}
.upl-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.upl-item img,.upl-item .fi{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#f1efe9;display:grid;place-items:center;color:var(--muted);flex:none}
.upl-item .meta{flex:1;min-width:0}
.upl-item .meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.upl-item .meta span{font-size:12px;color:var(--muted)}
details.paste{margin-top:12px}
details.paste summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--primary)}
details.paste textarea{margin-top:10px}
.steps{display:grid;gap:10px;margin:8px 0}
.step{display:flex;gap:12px;align-items:center;font-weight:500;color:#9aa0ae}
.step .sd{width:28px;height:28px;border-radius:50%;border:2px solid #dcd8ce;display:grid;place-items:center;flex:none}
.step.done{color:var(--ink)}
.step.done .sd{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur{color:var(--ink)}
.step.cur .sd{border-color:var(--primary);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:36px;height:36px;border:3px solid #dfe4f8;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(17,26,51,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:20px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:rise .2s}
.modal.wide{width:min(820px,100%)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px}
.modal header h3{font-size:20px}
.modal .mb{padding:12px 20px;overflow:auto}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px 18px;border-top:1px solid #f0ede6;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:grid;gap:8px}
.toast{background:var(--side);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:360px;animation:rise .2s;display:flex;gap:10px;align-items:center}
.toast.ok svg{color:#35c88a}.toast.bad svg{color:#ff8080}
/* Student */
body.student .app{grid-template-columns:1fr}
body.student .side,body.student .bottom,body.student .top{display:none!important}
body.student main{max-width:820px;margin:0 auto;padding:24px 16px 60px}
.s-hero{background:var(--side);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px;background-image:radial-gradient(500px 240px at 110% -20%,rgba(232,163,61,.35),transparent),radial-gradient(500px 260px at -10% 120%,rgba(41,72,209,.45),transparent)}
.s-hero h2{font-size:28px;margin:10px 0 6px}
.s-hero .meta{display:flex;gap:14px;flex-wrap:wrap;color:#c3cbe2;font-size:14px}
.s-hero .meta span{display:flex;gap:6px;align-items:center}
.s-brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:600;color:var(--muted);font-size:14px}
.s-brand .logo{width:32px;height:32px;font-size:18px;border-radius:9px}
.plist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.plist li{display:flex;gap:10px;font-size:14px}
.plist li svg{color:var(--primary);flex:none;margin-top:3px}
.pre{white-space:pre-wrap}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .side{display:none}
 .top{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:rgba(244,243,239,.9);backdrop-filter:blur(10px);padding:12px 16px;border-bottom:1px solid var(--line)}
 .top h1{font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .top .logo{width:34px;height:34px;font-size:19px;border-radius:10px}
 main{padding:18px 14px 100px}
 .page-head h2{font-size:25px}
 .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px;border-radius:10px}
 .bottom a.active{color:var(--primary);background:var(--primary-soft)}
 .modal-bg{align-items:flex-end;padding:0}
 .modal,.modal.wide{width:100%;border-radius:20px 20px 0 0;max-height:94vh}
 .dyn-row{grid-template-columns:1fr 70px 36px}
 .dyn-row .desc{grid-column:1/3}
 .gab-row{grid-template-columns:56px 1fr 70px 36px}
 .gab-row .resp{grid-column:1/4}
 .gab-row .conc{grid-column:1/4}
 .card{padding:16px}
 #toasts{left:12px;right:12px;bottom:84px}
 .ring{width:108px;height:108px}.ring>div{width:88px;height:88px}.ring b{font-size:27px}
}
@media (max-width:520px){.upl-btns{grid-template-columns:1fr}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">C</div><div><b>Cátedra</b><small>Gestão acadêmica com IA</small></div></div>
    <nav id="sideNav"></nav>
    <div class="side-foot">
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Somente local</span></div>
      <button onclick="Sync.run()" id="syncBtn"></button>
    </div>
  </aside>
  <div class="content">
    <header class="top"><div class="logo">C</div><h1 id="pageTitle">Cátedra</h1><span class="dot" id="syncDot2"></span></header>
    <main id="main"></main>
  </div>
  <nav class="bottom" id="bottomNav"></nav>
</div>
<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
'use strict';
/* =========================================================
   CÁTEDRA — sistema de turmas, avaliações e correção por IA
   Armazenamento: IndexedDB (local) + GitHub Gist (sincronização)
   ========================================================= */

const LIBS = {
  jspdf: 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  autotable: 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js',

function loadScript(src) {

    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Falha ao carregar biblioteca: ' + src)); document.head.appendChild(s);
  });
}

/* ---------- IndexedDB ---------- */
const STORES = ['turmas', 'alunos', 'atividades', 'entregas', 'meta'];
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('catedra', 1);
      r.onupgradeneeded = () => { const d = r.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => { const q = fn(this.db.transaction(store, mode).objectStore(store)); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  },
  all(s) { return this.req(s, 'readonly', o => o.getAll()); },
  get(s, id) { return this.req(s, 'readonly', o => o.get(id)); },
  put(s, v) { return this.req(s, 'readwrite', o => o.put(v)); },
  del(s, id) { return this.req(s, 'readwrite', o => o.delete(id)); },
  clear(s) { return this.req(s, 'readwrite', o => o.clear()); }
};

const S = { turmas: [], alunos: [], atividades: [], entregas: [], cfg: null, local: null };
const live = a => a.filter(x => !x.deleted);
const byId = (st, id) => S[st].find(x => x.id === id);
const alunosDe = tid => live(S.alunos).filter(a => a.turmaId === tid).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
const atvsDe = tid => live(S.atividades).filter(a => a.turmaId === tid).sort((a, b) => (a.criadoEm || 0) - (b.criadoEm || 0));
const entregasDe = (atvId, alunoId) => live(S.entregas).filter(e => e.atividadeId === atvId && (!alunoId || e.alunoId === alunoId)).sort((a, b) => b.criadoEm - a.criadoEm);
function entregaValida(atvId, alunoId) {
  const es = entregasDe(atvId, alunoId); if (!es.length) return null;
  return es.reduce((a, b) => (notaFinal(b) > notaFinal(a) ? b : a));
}
function desempenho(aluno) {
  const atvs = atvsDe(aluno.turmaId); let obt = 0, pos = 0, posEnt = 0, feitas = 0;
  atvs.forEach(a => { pos += +a.notaMax || 0; const e = entregaValida(a.id, aluno.id); if (e) { obt += notaFinal(e) || 0; posEnt += +a.notaMax || 0; feitas++; } });
  return { obt: round2(obt), pos, pct: posEnt ? obt / posEnt : null, feitas, total: atvs.length };
}
function aprovTurma(tid) {
  const ps = alunosDe(tid).map(a => desempenho(a).pct).filter(p => p != null);
  return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null;
}

async function putLocal(st, obj) {

}
async function save(st, obj) {
  obj.updatedAt = Date.now();

  if (st === 'entregas') Sync.dirtyArq.add(obj.atividadeId);

}
async function removeRec(st, id) {
  const o = byId(st, id); if (!o) return;
  o.deleted = true; await save(st, o);
  if (st === 'turmas') { for (const a of S.alunos.filter(x => x.turmaId === id && !x.deleted)) { a.deleted = true; await save('alunos', a); } for (const a of S.atividades.filter(x => x.turmaId === id && !x.deleted)) { a.deleted = true; await save('atividades', a); } }
  if (st === 'atividades') { for (const e of S.entregas.filter(x => x.atividadeId === id && !x.deleted)) { e.deleted = true; await save('entregas', e); } }
}

function modal({ title, body, actions = [], wide = false, onOpen }) {
  const root = $('#modalRoot'); const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog"><header><h3>${esc(title)}</h3><button class="icon-btn" data-x>${ic('x')}</button></header><div class="mb">${body}</div>${actions.length ? `<footer>${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-i="${i}">${a.label}</button>`).join('')}</footer>` : ''}</div>`;
  const close = () => bg.remove();
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  bg.querySelector('[data-x]').onclick = close;
  $$('[data-i]', bg).forEach(b => b.onclick = async () => {
    const a = actions[+b.dataset.i]; if (!a.onClick) return close();
    b.disabled = true;
    try { const r = await a.onClick(bg.querySelector('.modal'), b); if (r !== false) close(); }
    catch (err) { toast(err.message, 'bad'); }
    finally { b.disabled = false; }
  });
  root.appendChild(bg); if (onOpen) onOpen(bg.querySelector('.modal'));
  const f = bg.querySelector('input,select,textarea'); if (f && innerWidth > 900) setTimeout(() => f.focus(), 50);
  return { close, el: bg.querySelector('.modal') };
}

/* =========================================================
   SINCRONIZAÇÃO (GitHub Gist)
   data.json    -> turmas, alunos, atividades (last-write-wins por registro)
   config.json  -> dados do professor e configuração da IA
   e_*.json     -> entregas enviadas pelos alunos (1 arquivo por envio, sem conflito)
   arq_<id>.json-> entregas consolidadas por atividade (mantidas pelo professor)
   ========================================================= */
async function gh(path, opts = {}, token) {
  const r = await fetch('https://api.github.com' + path, {
    ...opts, cache: 'no-store',
    headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }
  });
  if (!r.ok) {
    let m = ''; try { m = (await r.json()).message; } catch { }
    const msg = r.status === 401 ? 'Token do GitHub inválido ou expirado' : r.status === 404 ? 'Gist não encontrado (verifique o ID e as permissões do token)' : r.status === 403 ? 'Acesso negado/limite do GitHub atingido' : 'Erro do GitHub';
    const e = new Error(`${msg} (${r.status}${m ? ': ' + m : ''})`); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}
async function fileContent(f) {
  if (!f) return null;
  if (f.truncated) { const r = await fetch(f.raw_url, { cache: 'no-store' }); return r.text(); }
  return f.content;
}

const Sync = {
  busy: false, again: false, timer: null, dirtyArq: new Set(), state: 'off', lastError: '',
  configured() { return !!(S.local && S.local.token && S.local.gistId); },
  schedule() { if (!this.configured()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(true), 1200); },
  start() {
    this.ui();
    if (this.configured()) this.run(true);
    setInterval(() => { if (!document.hidden && this.configured()) this.run(true); }, 20000);
    window.addEventListener('focus', () => this.configured() && this.run(true));
    window.addEventListener('online', () => this.configured() && this.run(true));
  },
  ui() {
    const dotC = this.state === 'ok' ? 'ok' : this.state === 'busy' ? 'busy' : this.state === 'err' ? 'err' : '';
    ['#syncDot', '#syncDot2'].forEach(s => { const d = $(s); if (d) d.className = 'dot ' + dotC; });
    const txt = !this.configured() ? 'Somente local' : this.state === 'busy' ? 'Sincronizando…' : this.state === 'err' ? 'Erro na sincronização' : 'Sincronizado ' + (S.local.lastSync ? new Date(S.local.lastSync).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '');
    $('#syncText').textContent = txt;
    $('#syncText').title = this.lastError || '';
    $('#syncBtn').innerHTML = this.configured() ? ic('refresh', 15) + ' Sincronizar agora' : ic('cloud', 15) + ' Configurar nuvem';
  },
  async run(silent = false) {
    if (!this.configured()) { if (!silent) go('config'); return; }
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.state = 'busy'; this.ui();
    let changed = false; const novas = [];
    try {
      const { token, gistId } = S.local;
      const g = await gh(`/gists/${gistId}`, {}, token);
      // 1) data.json
      const fd = g.files['data.json']; const remoteDataStr = await fileContent(fd);
      if (remoteDataStr) {
        const rd = JSON.parse(remoteDataStr);
        for (const st of ['turmas', 'alunos', 'atividades']) for (const r of rd[st] || []) {
          const l = byId(st, r.id); if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) { await putLocal(st, r); changed = true; }
        }
      }
      // 2) config.json
      const fc = g.files['config.json']; const remoteCfgStr = await fileContent(fc);
      if (remoteCfgStr) { const rc = JSON.parse(remoteCfgStr); if ((rc.updatedAt || 0) > (S.cfg.updatedAt || 0)) { S.cfg = { ...rc, id: 'cfg' }; await DB.put('meta', S.cfg); changed = true; } }
      // 3) entregas
      const toDelete = [];
      for (const [name, file] of Object.entries(g.files)) {
        if (!/^(e|arq)_.*\.json$/.test(name)) continue;
        let c; try { c = JSON.parse(await fileContent(file)); } catch { continue; }
        const arr = Array.isArray(c) ? c : [c];
        for (const r of arr) {
          if (!r || !r.id) continue;
          const l = byId('entregas', r.id);
          if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) { if (!l && !r.deleted) novas.push(r); await putLocal('entregas', r); changed = true; }
        }
        if (name.startsWith('e_')) { toDelete.push(name); arr.forEach(r => r && this.dirtyArq.add(r.atividadeId)); }
      }
      // 4) envio das alterações locais
      const files = {};
      const ld = JSON.stringify(buildData()); if (ld !== remoteDataStr) files['data.json'] = { content: ld };
      const lc = JSON.stringify(cfgPublic()); if (lc !== remoteCfgStr) files['config.json'] = { content: lc };
      for (const aid of this.dirtyArq) { const list = S.entregas.filter(e => e.atividadeId === aid); if (list.length) files[`arq_${aid}.json`] = { content: JSON.stringify(list) }; }
      toDelete.forEach(n => files[n] = null);
      if (Object.keys(files).length) await gh(`/gists/${gistId}`, { method: 'PATCH', body: JSON.stringify({ files }) }, token);
      this.dirtyArq.clear();
      S.local.lastSync = Date.now(); await saveLocal();
      this.state = 'ok'; this.lastError = '';
      if (!silent) toast('Sincronização concluída', 'ok');
    } catch (err) {
      this.state = 'err'; this.lastError = err.message;
      if (!silent) toast(err.message, 'bad', 6000);
      console.warn('Sync:', err);
    } finally {
      this.busy = false; this.ui();
      if (novas.length > 2) toast(`${novas.length} novas entregas recebidas`, 'ok', 6000); else novas.forEach(n => toast(`Nova entrega: ${n.alunoNome || 'aluno'} — ${fmtN(notaFinal(n))}`, 'ok', 6000));
      if (changed) softRefresh();
      if (this.again) { this.again = false; setTimeout(() => this.run(true), 300); }
    }
  }
};

const OBF = new TextEncoder().encode('catedra::link::v1');
function b64u(bytes) { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

function decodePayload(s) { const b = unb64u(s); return JSON.parse(new TextDecoder().decode(b.map((x, i) => x ^ OBF[i % OBF.length]))); }

async function aiCall(cfg, { system, text, images = [] }) {
  const ai = cfg.ai || {}; const provider = ai.provider || 'anthropic'; const model = ai.model || MODELS[provider]; const key = ai.key;
  if (!key) throw new Error('A chave da IA não foi configurada pelo professor.');
  let r, j;
  if (provider === 'anthropic') {
    const content = [...images.map(d => ({ type: 'image', source: { type: 'base64', media_type: d.mime, data: d.b64 } })), { type: 'text', text }];
    r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model, max_tokens: 8000, system, messages: [{ role: 'user', content }] }) });
    j = await r.json(); if (!r.ok) throw new Error('IA (Anthropic): ' + (j.error?.message || r.status));
    return j.content.filter(c => c.type === 'text').map(c => c.text).join('');
  }
  if (provider === 'openai') {
    const content = [{ type: 'text', text }, ...images.map(d => ({ type: 'image_url', image_url: { url: `data:${d.mime};base64,${d.b64}` } }))];
    r = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: JSON.stringify({ model, response_format: { type: 'json_object' }, messages: [{ role: 'system', content: system }, { role: 'user', content }] }) });
    j = await r.json(); if (!r.ok) throw new Error('IA (OpenAI): ' + (j.error?.message || r.status));
    return j.choices[0].message.content;
  }
  if (provider === 'gemini') {
    const parts = [...images.map(d => ({ inline_data: { mime_type: d.mime, data: d.b64 } })), { text }];
    r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts }], generationConfig: { responseMimeType: 'application/json', temperature: 0.2 } }) });
    j = await r.json(); if (!r.ok) throw new Error('IA (Gemini): ' + (j.error?.message || r.status));
    return (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  }
  throw new Error('Provedor de IA desconhecido');
}
function parseJSON(s) {
  s = String(s || '').trim().replace(/^```(?:json)?/i, '').replace(/```\s*$/, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b < 0) throw new Error('A IA não retornou um resultado válido. Tente novamente.');
  return JSON.parse(s.slice(a, b + 1));
}
async function aiJSON(cfg, req) {
  let last;
  for (let i = 0; i < 2; i++) { try { return parseJSON(await aiCall(cfg, req)); } catch (e) { last = e; if (/chave|401|403|invalid.*key|api key/i.test(e.message)) break; await sleep(800); } }
  throw last;
}

async function compressImage(file, max = 1600, q = 0.82) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Imagem inválida: ' + file.name)); i.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(src, 0, 0, c.width, c.height);
  return { mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', q).split(',')[1] };
}
async function extractPdf(file) {
  await loadLib('pdfjs');
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let text = ''; const n = Math.min(pdf.numPages, 60);
  for (let i = 1; i <= n; i++) { const pg = await pdf.getPage(i); const tc = await pg.getTextContent(); text += tc.items.map(t => t.str + (t.hasEOL ? '\n' : ' ')).join('') + '\n\n'; }
  const images = [];
  if (text.replace(/\s/g, '').length < 80 * Math.min(n, 3)) { // PDF escaneado: renderiza as páginas
    text = '';
    for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
      const pg = await pdf.getPage(i); const vp = pg.getViewport({ scale: 1.6 });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      images.push({ mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', .8).split(',')[1] });
    }
  }
  return { text, images };
}
async function extractFiles(files, pasted) {
  let text = pasted ? pasted + '\n' : ''; const images = []; const nomes = [];
  for (const f of files) {
    nomes.push(f.name); const n = f.name.toLowerCase();
    if (f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif)$/.test(n)) images.push(await compressImage(f));
    else if (f.type === 'application/pdf' || n.endsWith('.pdf')) { const r = await extractPdf(f); text += r.text; images.push(...r.images); }
    else if (n.endsWith('.docx')) { await loadLib('mammoth'); const r = await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() }); text += r.value + '\n'; }
    else if (/\.(txt|md|rtf)$/.test(n) || f.type.startsWith('text/')) text += await f.text() + '\n';
    else if (n.endsWith('.doc')) throw new Error('Arquivos .doc antigos não são suportados. Salve como .docx ou PDF e envie novamente.');
    else throw new Error('Formato não suportado: ' + f.name);
  }
  if (images.length > 12) throw new Error('Envie no máximo 12 páginas/imagens.');
  if (!text.trim() && !images.length) throw new Error('Nenhum conteúdo encontrado. Selecione um arquivo ou cole o texto.');
  return { text: text.trim(), images, nomes };
}
async function processSubmission(cfg, atv, files, pasted, step) {
  step(0); const { text, images, nomes } = await extractFiles(files, pasted);
  step(1); const r = atv.tipo === 'prova' ? await gradeProva(cfg, atv, text, images) : await gradeTrabalho(cfg, atv, text, images);
  step(2);
  return { ...r, textoExtraido: text.slice(0, 6000), arquivos: nomes, paginas: images.length };

      : `<label class="drop" data-drop>${ic('upload', 30)}<b>Toque para selecionar ou arraste o arquivo</b><span>PDF, DOCX, TXT ou fotos das páginas</span><input type="file" accept=".pdf,.docx,.txt,.md,image/*" multiple hidden data-upl></label>

      <div class="upl-list" id="uplList"></div></div>`;
  },
  bind(root) {
    this.files = [];
    $$('[data-upl]', root).forEach(inp => inp.addEventListener('change', () => { this.add([...inp.files]); inp.value = ''; }));
    const d = $('[data-drop]', root);
    if (d) { d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); }); d.addEventListener('dragleave', () => d.classList.remove('over')); d.addEventListener('drop', e => { e.preventDefault(); d.classList.remove('over'); this.add([...e.dataTransfer.files]); }); }
    this.render();
  },
  add(fs) { this.files.push(...fs); this.render(); },
  remove(i) { this.files.splice(i, 1); this.render(); },
  render() {
    const el = $('#uplList'); if (!el) return;
    el.innerHTML = this.files.map((f, i) => `<div class="upl-item">${f.type.startsWith('image/') ? `<img src="${URL.createObjectURL(f)}" alt="">` : `<div class="fi">${ic('file', 22)}</div>`}<div class="meta"><b>${this.files.length > 1 ? (i + 1) + '. ' : ''}${esc(f.name)}</b><span>${(f.size / 1024).toFixed(0)} KB</span></div><button type="button" class="icon-btn" onclick="Upl.remove(${i})" title="Remover">${ic('x')}</button></div>`).join('');
  },
  text() { return ($('#uplText')?.value || '').trim(); }
};

function renderRelatorio(e, atv, { student = false, aluno = null } = {}) {
  const R = e.relatorio || {}; const nf = notaFinal(e); const p = pctE(e);
  const rc = p == null ? 'var(--muted)' : p >= .7 ? 'var(--ok)' : p >= .5 ? 'var(--warn)' : 'var(--bad)';
  const showNota = !student || atv.mostrarNota !== false;
  let h = `<div class="card"><div class="report-head">
    ${showNota ? `<div class="ring" style="--p:${Math.round((p || 0) * 100)};--rc:${rc}"><div><b>${fmtN(nf)}</b><span>de ${fmtN(e.notaMax)}</span></div></div>` : ''}
    <div style="flex:1;min-width:220px"><div class="actions" style="margin-bottom:8px"><span class="badge ${atv.tipo === 'prova' ? 'dark' : ''}">${atv.tipo === 'prova' ? 'Prova' : esc(SUBTIPOS[atv.subtipo] || 'Trabalho')}</span>${e.notaManual != null && e.notaManual !== '' ? '<span class="badge warn">Nota ajustada pelo professor</span>' : ''}${e.atrasado ? '<span class="badge bad">Entregue após o prazo</span>' : ''}${e.origem === 'professor' ? '<span class="badge gray">Lançada pelo professor</span>' : ''}</div>

    <div class="muted small">${esc(aluno?.nome || e.alunoNome || '')} · ${fmtDate(e.criadoEm)} · tentativa ${e.tentativa || 1}${e.arquivos?.length ? ' · ' + esc(e.arquivos.join(', ')) : ''}</div>
    ${R.tipo === 'prova' ? `<div class="muted small" style="margin-top:6px">${fmtN(R.pontosObtidos)} de ${fmtN(R.pontosTotais)} pontos${R.totalObjetivas ? ` · ${R.acertosObjetivas}/${R.totalObjetivas} objetivas corretas` : ''}${R.legibilidade ? ' · Legibilidade: ' + esc(R.legibilidade) : ''}</div>` : ''}
    ${R.tipo === 'trabalho' && R.palavras ? `<div class="muted small" style="margin-top:6px">${R.palavras} palavras${R.palavrasEstimadas ? ' (estimado)' : ''}${R.foraLimite ? ` · <b style="color:var(--bad)">fora do limite${R.penalidade ? ` (−${fmtN(R.penalidade)} pts)` : ''}</b>` : ''}</div>` : ''}
    </div></div>
    ${R.parecer ? `<div class="parecer" style="margin-top:18px">${esc(R.parecer)}</div>` : ''}
    ${e.obsProfessor ? `<div class="alert info" style="margin:14px 0 0">${ic('user')}<div><b>Comentário do professor:</b> ${esc(e.obsProfessor)}</div></div>` : ''}
  </div>`;
  if (R.criterios?.length) h += `<div class="card" style="margin-top:16px"><h3>Critérios de avaliação</h3>${R.criterios.map(c => `<div class="crit"><div class="crit-top"><span>${esc(c.nome)} <span class="muted small">· peso ${fmtN(c.peso)}</span></span><span class="nota ${cls(c.nota / 10)}">${fmtN(c.nota)}</span></div><div class="bar" style="--c:${c.nota >= 7 ? 'var(--ok)' : c.nota >= 5 ? 'var(--warn)' : 'var(--bad)'}"><i style="width:${c.nota * 10}%"></i></div>${c.comentario ? `<p>${esc(c.comentario)}</p>` : ''}</div>`).join('')}</div>`;
  if (R.questoes?.length) h += `<div class="card" style="margin-top:16px"><h3>Questões</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>Q</th><th>Tipo</th><th>Resposta do aluno</th>${student && atv.mostrarGabarito === false ? '' : '<th>Gabarito</th>'}<th class="num">Pontos</th><th>Comentário</th></tr></thead><tbody>${R.questoes.map(q => `<tr><td><b>${esc(q.numero)}</b></td><td><span class="badge ${q.tipo === 'objetiva' ? 'gray' : ''}">${q.tipo === 'objetiva' ? 'Objetiva' : 'Aberta'}</span></td><td style="max-width:280px">${esc(q.respostaAluno || '—')}</td>${student && atv.mostrarGabarito === false ? '' : `<td style="max-width:240px" class="small muted">${esc(q.esperada)}</td>`}<td class="num"><span class="nota ${cls(q.fracao)}">${fmtN(q.pontos)}/${fmtN(q.valor)}</span></td><td class="small" style="min-width:180px">${esc(q.comentario)}</td></tr>`).join('')}</tbody></table></div></div>`;
  if (R.conformidade?.length) h += `<div class="card" style="margin-top:16px"><h3>Parâmetros exigidos</h3>${R.conformidade.map(c => `<div class="conf"><span class="ci ${c.atendido ? 'ok' : 'bad'}">${ic(c.atendido ? 'check' : 'x', 13)}</span><div><b>${esc(c.parametro)}</b>${c.obs ? `<div class="muted small">${esc(c.obs)}</div>` : ''}</div></div>`).join('')}</div>`;
  if (R.pontosFortes?.length || R.melhorias?.length) h += `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:16px">
    <div class="card"><h3 style="color:var(--ok)">Pontos fortes</h3><ul class="blist">${(R.pontosFortes || []).map(x => `<li>${esc(x)}</li>`).join('') || '<li class="muted">—</li>'}</ul></div>
    <div class="card"><h3 style="color:var(--warn)">O que melhorar</h3><ul class="blist">${(R.melhorias || []).map(x => `<li>${esc(x)}</li>`).join('') || '<li class="muted">—</li>'}</ul></div></div>`;
  if (!student && (R.indicios || R.resumo || e.textoExtraido)) h += `<div class="card" style="margin-top:16px">${R.resumo ? `<h3>Resumo do trabalho</h3><p>${esc(R.resumo)}</p>` : ''}${R.indicios ? `<div class="alert warn">${ic('shield')}<div><b>Atenção (visível só para você):</b> ${esc(R.indicios)}</div></div>` : ''}${R.nomeNaProva ? `<p class="small muted">Nome identificado na prova: <b>${esc(R.nomeNaProva)}</b></p>` : ''}${e.textoExtraido ? `<details class="raw"><summary>Texto extraído do envio</summary><pre>${esc(e.textoExtraido)}</pre></details>` : ''}</div>`;
  return h;
}

/* =========================================================
   PDF
   ========================================================= */
const T = s => String(s ?? '').replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/\u2026/g, '...').replace(/[\u2022\u00B7]/g, '-').replace(/[^\x09\x0A\x0D\x20-\x7E\u00A0-\u00FF]/g, '');
async function pdfNew(orient = 'p') { await loadLib('jspdf'); await loadLib('autotable'); const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: orient }); doc._y = 0; return doc; }
const PW = d => d.internal.pageSize.getWidth(), PH = d => d.internal.pageSize.getHeight(), M = 15;
function pHeader(doc, title, sub) {
  doc.setFillColor(17, 26, 51); doc.rect(0, 0, PW(doc), 32, 'F'); doc.setFillColor(232, 163, 61); doc.rect(0, 32, PW(doc), 1.2, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text(T(title).slice(0, 90), M, 15);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(200, 208, 230); doc.text(T(sub).slice(0, 120), M, 23);
  const right = [S.cfg?.professor, S.cfg?.instituicao].filter(Boolean).map(T);
  right.forEach((r, i) => doc.text(r, PW(doc) - M, 13 + i * 5, { align: 'right' }));
  doc.setTextColor(22, 33, 58); doc._y = 44;
}
function ensure(doc, h) { if (doc._y + h > PH(doc) - 16) { doc.addPage(); doc._y = 18; } }
function pH2(doc, t, color = [41, 72, 209]) { ensure(doc, 14); doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...color); doc.text(T(t), M, doc._y); doc.setTextColor(22, 33, 58); doc._y += 6.5; }
function pH3(doc, t) { ensure(doc, 10); doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.text(T(t), M, doc._y); doc._y += 5.5; }
function pPara(doc, t, size = 9.5, indent = 0) {
  doc.setFont('helvetica', 'normal'); doc.setFontSize(size);
  for (const ln of doc.splitTextToSize(T(t), PW(doc) - 2 * M - indent)) { ensure(doc, 5); doc.text(ln, M + indent, doc._y); doc._y += size * 0.44; }
  doc._y += 2;
}
function pList(doc, items) { items.forEach(it => { ensure(doc, 5); doc.setFontSize(9.5); doc.text('-', M + 1, doc._y); pPara(doc, it, 9.5, 5); doc._y -= 1; }); doc._y += 2; }
function pTable(doc, head, body, opts = {}) {
  doc.autoTable({ startY: doc._y, head: head.length ? [head.map(T)] : [], body: body.map(r => r.map(c => typeof c === 'object' && c !== null ? { ...c, content: T(c.content) } : T(c))), margin: { left: M, right: M }, styles: { fontSize: 8.6, cellPadding: 2, textColor: [22, 33, 58], lineColor: [231, 228, 220], lineWidth: .1, overflow: 'linebreak' }, headStyles: { fillColor: [41, 72, 209], textColor: 255, fontStyle: 'bold' }, alternateRowStyles: { fillColor: [249, 248, 245] }, ...opts });
  doc._y = doc.lastAutoTable.finalY + 7;
}
function pKV(doc, pairs) { pTable(doc, [], pairs, { theme: 'plain', showHead: 'never', styles: { fontSize: 9.5, cellPadding: 1.4 }, columnStyles: { 0: { fontStyle: 'bold', cellWidth: 42 } } }); doc._y -= 3; }
function pFooter(doc) {
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140); doc.text(T(`Cátedra - gerado em ${fmtDate(Date.now())}`), M, PH(doc) - 8); doc.text(`Página ${i} de ${n}`, PW(doc) - M, PH(doc) - 8, { align: 'right' }); }
}
function notaColor(p) { return p == null ? [120, 120, 120] : p >= .7 ? [27, 143, 98] : p >= .5 ? [183, 116, 26] : [201, 59, 59]; }
function pdfEntregaSection(doc, e, atv, aluno, { student = false } = {}) {
  const R = e.relatorio || {}; const nf = notaFinal(e);
  pH2(doc, atv.titulo);
  const showNota = !student || atv.mostrarNota !== false;

  localStorage.setItem(pendKey(), JSON.stringify(e));
  setStep(3);
  await sShowResult(e, false);
}
function sUploadStep2() { $('#sUp').outerHTML = '<div id="sId"></div>'; sUploadStep(); }
async function sSave(e) {
  let last;
  for (let i = 0; i < 3; i++) {
    try { await gh(`/gists/${ST.P.g}`, { method: 'PATCH', body: JSON.stringify({ files: { [`e_${e.atividadeId}_${e.alunoId}_${e.criadoEm}.json`]: { content: JSON.stringify(e) } } }) }, ST.P.t); localStorage.removeItem(pendKey()); return true; }
    catch (err) { last = err; await sleep(1200 * (i + 1)); }
  }
  throw last;
}
async function sShowResult(e, retrying) {
  const target = $('#sUp') || $('#sId');
  try { await sSave(e); }
  catch (err) {
    target.outerHTML = `<div class="card" id="sUp"><div class="alert bad">${ic('alert')}<div><b>Sua correção foi feita, mas não conseguimos registrá-la para o professor.</b><br>${esc(err.message)}. Verifique sua internet e toque em "Enviar novamente". Não feche esta página.</div></div><button class="btn primary big" style="width:100%" onclick="sShowResult(sGetPending(),true)">${ic('refresh')} Enviar novamente</button></div>`;
    return;
  }
  target.outerHTML = `<div class="alert ok">${ic('check')}<div><b>Envio registrado com sucesso!</b> Seu professor já recebeu ${ST.atv.tipo === 'prova' ? 'sua prova' : 'seu trabalho'}. Protocolo: <b>${e.id.toUpperCase()}</b></div></div><div id="sRes"></div>`;
  sRenderResult(e);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function sRenderResult(e) {
  const { atv } = ST; const el = $('#sRes'); if (!el) return;
  if (atv.mostrarRelatorio === false && atv.mostrarNota === false) { el.innerHTML = `<div class="card empty"><div class="ei">${ic('check', 28)}</div><h3>Recebido!</h3><p>O professor divulgará a nota e o relatório posteriormente.</p></div>`; return; }
  const restantes = (atv.tentativas || 1) - (ST.anteriores.length + (ST.anteriores.some(x => x.id === e.id) ? 0 : 1));
  el.innerHTML = (atv.mostrarRelatorio === false
    ? `<div class="card"><div class="report-head"><div class="ring" style="--p:${Math.round((pctE(e) || 0) * 100)};--rc:var(--primary)"><div><b>${fmtN(notaFinal(e))}</b><span>de ${fmtN(e.notaMax)}</span></div></div><div><h3>${esc(atv.titulo)}</h3><p class="muted">O relatório detalhado será liberado pelo professor.</p></div></div></div>`
    : renderRelatorio(e, atv, { student: true, aluno: ST.aluno }))
    + `<div class="actions" style="margin-top:16px;justify-content:center"><button class="btn primary" id="sPdf">${ic('download')} Baixar relatório em PDF</button>${restantes > 0 ? `<button class="btn" onclick="sNovaTentativa()">${ic('refresh')} Nova tentativa (${restantes} restante${restantes > 1 ? 's' : ''})</button>` : ''}</div>`;
  $('#sPdf').onclick = () => pdfStudentEntrega(e, atv, ST.aluno, ST.turma, ST.cfg).catch(err => toast(err.message, 'bad'));
}
async function sNovaTentativa() {
  $('#main').innerHTML = sShell(`<div class="card" id="sId"><div class="spinner"></div></div>`);
  ST.anteriores = await sCollectEntregas(ST.aluno.id);
  if (ST.anteriores.length >= (ST.atv.tentativas || 1)) { toast('Você não tem mais tentativas', 'bad'); return sIntro(); }
  sUploadStep();
}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
async function boot() {
  const student = /^#\/?enviar\//.test(location.hash);
  try {
    await DB.open();
    S.local = await DB.get('meta', 'local') || { id: 'local', token: '', gistId: '', lastSync: 0 };
    S.cfg = await DB.get('meta', 'cfg') || { id: 'cfg', professor: '', instituicao: '', publicUrl: '', ai: { provider: 'anthropic', model: MODELS.anthropic, key: '' }, updatedAt: 0 };
    for (const st of ['turmas', 'alunos', 'atividades', 'entregas']) S[st] = await DB.all(st);
  } catch (e) {
    if (!student) { $('#main').innerHTML = `<div class="alert bad">${ic('alert')}<div>Não foi possível abrir o banco de dados local (IndexedDB): ${esc(e.message)}. Saia do modo anônimo ou use outro navegador.</div></div>`; return; }
    S.local = { token: '', gistId: '' }; S.cfg = {};
  }
  window.addEventListener('hashchange', router);
  router();
  if (!student) Sync.start();
}
boot();
</script>
